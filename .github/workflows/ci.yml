name: CI

on:
  push:
    branches:
      - master

jobs:

  check-bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check bench
        run: |
          existing_bench=$(cat .bench)
          new_bench=$(cargo run --release --package engine -- benchnodes)

          if [ "${existing_bench}" != "${new_bench}" ]; then
            echo "Bench mismatch"
            echo "Old: ${existing_bench}"
            echo "New: ${new_bench}"
            exit 1
          else
            echo "Benches match: ${new_bench}"
          fi

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: |
          # Exclude the trainer as it requires CUDA
          cargo test --release --lib --bins --tests --workspace --exclude trainer

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        run: |
          rustup override set nightly
          rustup component add clippy

      - name: Clippy
        run: CARGO_BUILD_WARNINGS=deny cargo clippy --keep-going

  build-datagen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check
        run: cargo check --package engine --features datagen

  build-spsa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check
        run: cargo check --package engine --features spsa
