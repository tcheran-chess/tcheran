[workspace]
resolver = "3"
members = [
    "engine",
    "tools/data",
    "tools/zobrist",
    "tools/trainer"
]
default-members = ["engine"]

[workspace.package]
version = "14.0.0-dev"
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
static_mut_refs = "allow"

future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

wildcard_imports = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
option_if_let_else = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
inline_always = "allow"
missing_const_for_fn = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
type_complexity = "allow"
let_and_return = "allow"
significant_drop_tightening = "allow"
enum_glob_use = "allow"
large_stack_arrays = "allow"
new_without_default = "allow"
upper_case_acronyms = "allow"
if_not_else = "allow"
needless_range_loop = "allow"
unreadable_literal = "allow"

# Generally desired, but not ideal in a couple of places where we probably
# want to add more code later which would invalidate the refactoring.
useless_let_if_seq = "allow"

# I prefer, for subdirectories, keeping things for that module within the subdirectory
# but don't like lots of mod.rs files. mod.rs will be the registry for that module while
# modulename.rs will contain any top-level logic.
module_inception = "allow"

allow_attributes_without_reason = "warn"

[profile.release]
debug = true
panic = "abort"
codegen-units = 1
lto = true
