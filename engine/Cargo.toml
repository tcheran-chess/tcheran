[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "tcheran"

[features]
default = ["syzygy"]
syzygy = []
spsa = []
datagen = ["dep:rand"]

# Syzygy features
mmap = ["memmap2"]
variant = ["shakmaty/variant"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "tcheran"
path = "src/main.rs"

[dependencies]
rand = { version = "0.10.0", optional = true }

# Syzygy dependencies
arrayvec = "0.7"
bitflags = "2"
shakmaty = { version = "0.30" }
byteorder = "1.2"
rustc-hash = "2"
once_cell = "1.12"
tracing = "0.1.6"
memmap2 = { version = "0.9", optional = true }
csv = "1.4.0"

# Syzygy dependencies
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.143" # for optional posix_fadvise

[build-dependencies]
cc = "1.2.2"

[lints]
workspace = true
