[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "tcheran"

[features]
default = ["syzygy"]
syzygy = ["dep:cc"]
spsa = []
datagen = ["dep:rand"]
nnue-stats = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "tcheran"
path = "src/main.rs"

[dependencies]
rand = { version = "0.10.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[build-dependencies]
cc = { version = "1.2.2", optional = true }

[lints]
workspace = true
